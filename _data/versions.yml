# The current releases the guides install, read by the pages as
# {{ site.data.versions.<key> }}. Written by the versions-sync workflow from
# the latest GitHub releases (it opens a pull request when one changes); a
# manual edit is overwritten by the next sync. scripts/check_versions.py
# fails CI when a page hard-codes one of these releases instead.
platform: v0.21.0     # openctemio/openctem
sensor: v0.41.0       # openctemio/sensor (v0.38+ needs a platform that serves sealed task secrets, after v0.20.2)
sdk_go: v0.50.0       # openctemio/sdk-go
ci: v0.4.0            # openctemio/ci
chart: 0.41.0         # openctemio/helm-charts, chart openctem
chart_app: v0.21.0    # appVersion of that chart

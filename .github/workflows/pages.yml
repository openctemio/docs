name: Deploy to GitHub Pages

# The site prints the current releases and lists each release's changes
# without a commit here: the build reads the signed versions manifest
# (scripts/versions_manifest.py) and the release's changelog entries
# (scripts/release_pages.py). So it rebuilds when the platform's Release Feed
# run announces a release (repository_dispatch "release-published") and every
# 6 hours in case that announcement did not arrive. A manifest whose signature
# does not verify fails the build and the published site stays as it was.

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "37 */6 * * *"
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Current releases (signed manifest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/versions_manifest.py --verify .

      - name: Release change pages
        run: python3 scripts/release_pages.py .

      - name: Pages take every release from the generated data
        run: python3 scripts/check_versions.py .

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Publish /.well-known/security.txt (dot-directories are left out otherwise).
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: Secret Scan

# Keeps credentials and private keys out of this repository.
#
# - Private keys: fails when a change adds or modifies a private key block, a key
#   or keystore file, or anything under data/ (throwaway keys under testdata/ pass).
# - Betterleaks: a pull request scans only the commits it adds and fails on a
#   finding. A push to the default branch and the weekly schedule scan the full
#   history, so a key that slipped in some other way is reported within a week.
#   Verified false positives go in .gitleaksignore (commit:file:rule:line).
#
# Findings are printed redacted; nothing is uploaded anywhere.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BETTERLEAKS_VERSION: 1.9.0
      BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Private keys
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) bash .github/scripts/check-private-keys.sh "$PR_BASE" "$PR_HEAD" ;;
            merge_group) bash .github/scripts/check-private-keys.sh "$MG_BASE" "$MG_HEAD" ;;
            push) bash .github/scripts/check-private-keys.sh "$PUSH_BEFORE" "$PUSH_AFTER" ;;
            *) bash .github/scripts/check-private-keys.sh "" "" ;;
          esac

      - name: Install Betterleaks (pinned, checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o betterleaks.tgz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${BETTERLEAKS_SHA256}  betterleaks.tgz" | sha256sum -c -
          tar -xzf betterleaks.tgz betterleaks

      - name: Betterleaks
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          case "$EVENT" in
            pull_request) range="${PR_BASE}..HEAD" ;;
            merge_group) range="${MG_BASE}..${MG_HEAD}" ;;
            *) range="" ;;
          esac
          args=()
          if [ -n "$range" ]; then
            echo "Scanning the $(git rev-list --count "$range") commit(s) in $range"
            args=(--log-opts "$range")
          else
            echo "Scanning the full history ($(git rev-list --count --all) commits)"
            args=(--log-opts "--all")
          fi
          ./betterleaks git --config .betterleaks.toml --redact --no-banner \
            --exit-code 1 "${args[@]}" .

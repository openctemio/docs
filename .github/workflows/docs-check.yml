name: docs-check

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    name: Links, language and private addresses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The release data the pages print is generated at build time from the
      # signed versions manifest (never committed).
      - name: Current releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/versions_manifest.py --verify .
      - name: Environment variable tables of the release
        run: python3 scripts/env_reference.py .
      - name: Check Markdown
        run: python3 scripts/docs_check.py .

      # Install guides print releases from the generated _data/versions.yml,
      # never a hard-coded one.
      - name: Releases from the data file
        run: python3 scripts/check_versions.py .

      # Fails when the repository tracks commercial, internal-planning,
      # research or review material (listed in .gitignore; this also catches
      # git add -f and merges that bring such folders back).
      - name: Retired logo shapes
        run: bash .github/scripts/check-brand.sh

      - name: Private paths (self-test)
        run: bash .github/scripts/check-private-paths.test.sh >/dev/null

      - name: Private paths
        run: bash .github/scripts/check-private-paths.sh

      - name: Customer identifiers (self-test)
        run: bash .github/scripts/check-customer-identifiers.test.sh >/dev/null

      # Fails when a tracked file names a customer (case-insensitive fixed
      # strings from the CUSTOMER_DENYLIST secret, so the list is never
      # committed) or carries the live LAN range outside tests. Prints only
      # file:line. Passes with a notice when the secret is empty (forks).
      - name: Customer identifiers
        env:
          CUSTOMER_DENYLIST: ${{ secrets.CUSTOMER_DENYLIST }}
        run: bash .github/scripts/check-customer-identifiers.sh

  build:
    name: Jekyll build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The release data the pages print is generated at build time from the
      # signed versions manifest (never committed).
      - name: Current releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/versions_manifest.py --verify .
      - name: Environment variable tables of the release
        run: python3 scripts/env_reference.py .
      - name: Release change pages
        run: python3 scripts/release_pages.py --count 2 .
      - name: Build with Jekyll (same action as the Pages deploy)
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site
